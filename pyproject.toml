[project]
name = "kosis-mcp"
version = "0.1.0"
description = "MCP server for KOSIS OpenAPI metadata lookup"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
]

[project.scripts]
kosis-mcp = "kosis_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kosis_mcp"]

